<mat-card class="chat-container">
  <div #scrollContainer class="messages">
    @for (msg of messages(); track $index) {
    <mat-card class="message-card" [class.own]="msg.isOwn" [@messageAnim]>
      <div class="meta">
        <span class="author">{{ msg.author }}</span>
        <span class="time">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>
      <div class="text">{{ msg.text }}</div>
    </mat-card>
    }
  </div>

  <div class="input-row">
    <mat-form-field class="input-field" appearance="outline">
      <textarea matInput cdkTextareaAutosize placeholder="Введите сообщение..." [formControl]="textFormControl"
        (keydown.enter)="sendMessageToProjectManager(); $event.preventDefault()" rows="1">
      </textarea>
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="sendMessageToProjectManager()">Отправить</button>
  </div>
</mat-card>
