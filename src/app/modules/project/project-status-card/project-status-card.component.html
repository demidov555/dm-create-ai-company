<mat-card class="project-card">
  <mat-card-content>
    <div class="header">
      <div class="info">
        <h2>Project Status</h2>
        <p>Your AI team is currently working on the project</p>
      </div>
      <div class="action">
        <button mat-raised-button color="primary">
          <mat-icon class="icon">add</mat-icon>
          Add Task
        </button>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-labels">
        <span class="status-label mat-caption mat-primary">In Progress</span>
        <span class="percentage mat-caption mat-primary">75%</span>
      </div>
      <mat-progress-bar
        mode="determinate"
        value="75"
        color="primary"
      ></mat-progress-bar>
    </div>

    <div class="deployment-header">
      <div class="deployment-info">
        <mat-icon color="primary" class="success-icon">check_circle</mat-icon>
        <span class="mat-body-2">
          Project deployed at:
          <a
            href="https://ecommerce-projectfactory.com"
            target="_blank"
            class="deployment-link"
          >
            https://ecommerce-projectfactory.com
          </a>
        </span>
      </div>
      <button mat-raised-button color="accent" class="update-button">
        Update Live Site
      </button>
    </div>
  </mat-card-content>
</mat-card>
