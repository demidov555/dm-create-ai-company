<mat-card class="ai-team-card">
  <mat-card-content>
    <h2 class="mat-title mb-4">Your AI Team</h2>

    <div class="team-grid">
      <mat-card class="team-member-card">
        <mat-card-content>
          <div class="member-header">
            <div class="avatar green">
              <mat-icon>dns</mat-icon>
            </div>
            <div class="member-info">
              <h3 class="mat-body-1">AI Backend Dev</h3>
              <p class="mat-caption">Node.js expert</p>
            </div>
          </div>

          <div class="progress-section">
            <div class="progress-labels">
              <span>Tasks</span>
              <span>5/8 completed</span>
            </div>
            <mat-progress-bar
              color="primary"
              mode="determinate"
              value="62.5"
            ></mat-progress-bar>
          </div>
        </mat-card-content>
        <mat-card-actions class="member-footer">
          <span class="mat-caption">Last active: 8 min ago</span>
          <button mat-button color="primary">Message</button>
        </mat-card-actions>
      </mat-card>

      <mat-card class="team-member-card">
        <mat-card-content>
          <div class="member-header">
            <div class="avatar yellow">
              <mat-icon>verified</mat-icon>
            </div>
            <div class="member-info">
              <h3 class="mat-body-1">AI QA Engineer</h3>
              <p class="mat-caption">Testing specialist</p>
            </div>
          </div>

          <div class="progress-section">
            <div class="progress-labels">
              <span>Tasks</span>
              <span>4/6 completed</span>
            </div>
            <mat-progress-bar
              color="accent"
              mode="determinate"
              value="66.6"
            ></mat-progress-bar>
          </div>
        </mat-card-content>
        <mat-card-actions class="member-footer">
          <span class="mat-caption">Last active: 10 min ago</span>
          <button mat-button color="accent">Message</button>
        </mat-card-actions>
      </mat-card>
    </div>

    <div class="add-button">
      <button mat-stroked-button color="primary">
        <mat-icon class="mr-1">add_circle</mat-icon>
        Add New AI Team Member
      </button>
    </div>
  </mat-card-content>
</mat-card>
